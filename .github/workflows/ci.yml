name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx tsc --noEmit

      - run: npm run test:unit

      # Real Playwright run with intentional failures; asserts the Latch report.
      # It blanks TYPESAFE_API_KEY, so no secret is needed.
      - run: npm run test:e2e

      # Offline demonstration of the merge gate: infra -> PASS, regression -> BLOCK.
      - run: npm run demo
